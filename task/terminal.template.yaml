apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-labs-terminal-config
  namespace: $NAME
  labels:
    cms-labs.io/terminal-config: "true"
data:
  config.yaml: |-
    targets:
      - name: pc1
        label: PC1
        mode: exec
        command: [/bin/sh]
      - name: r1
        label: Router R1
        mode: exec
        command: [/usr/bin/vtysh]
      - name: r2
        label: Router R2
        mode: exec
        command: [/usr/bin/vtysh]
      - name: pc2
        label: PC2
        mode: exec
        command: [/bin/sh]
