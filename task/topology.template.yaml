apiVersion: v1
kind: ConfigMap
metadata:
  name: frr-r1-config
  namespace: $NAME
data:
  daemons: |-
    zebra=yes
    bgpd=no
    ospfd=no
    ospf6d=no
    ripd=no
    ripngd=no
    isisd=no
    pimd=no
    ldpd=no
    nhrpd=no
    eigrpd=no
    babeld=no
    sharpd=no
    pbrd=no
    bfdd=no
    fabricd=no
    vrrpd=no
    pathd=no
    staticd=yes
    
    vtysh_enable=yes
    zebra_options="-A 127.0.0.1 -s 90000000"
    staticd_options="-A 127.0.0.1"
    
  frr.conf: |-
    frr version 10.7.1
    frr defaults traditional
    hostname r1
    log stdout informational
    service integrated-vtysh-config
    !
    end
    
---
